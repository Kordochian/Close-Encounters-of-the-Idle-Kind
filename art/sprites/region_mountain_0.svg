 transform="translate(106 147) scale(0.8)" stroke="#0f1a14" stroke-width="0.5"><rect x="-1" y="-4" width="2" height="4" fill="#3b2a1a"/><path d="M0 -24 L 7 -11 L 3.5 -11 L 9 -4 L -9 -4 L -3.5 -11 L -7 -11 Z" fill="#1f4a32"/><path d="M0 -24 L 2.6 -19 L -2.6 -19 Z" fill="#e6edf7"/></g><g transform="translate(120 146) scale(0.8)" stroke="#0f1a14" stroke-width="0.5"><rect x="-1" y="-4" width="2" height="4" fill="#3b2a1a"/><path d="M0 -24 L 7 -11 L 3.5 -11 L 9 -4 L -9 -4 L -3.5 -11 L -7 -11 Z" fill="#1f4a32"/><path d="M0 -24 L 2.6 -19 L -2.6 -19 Z" fill="#e6edf7"/></g>
    <path d="M0 175 C 50 160, 120 170, 220 165 L 220 200 L 0 200 Z" fill="url(#hill)"/>
    <g transform="translate(10 185) scale(1.0)" stroke="#0f1a14" stroke-width="0.5"><rect x="-1" y="-4" width="2" height="4" fill="#3b2a1a"/><path d="M0 -24 L 7 -11 L 3.5 -11 L 9 -4 L -9 -4 L -3.5 -11 L -7 -11 Z" fill="#1f4a32"/></g><g transform="translate(26 183) scale(1.0)" stroke="#0f1a14" stroke-width="0.5"><rect x="-1" y="-4" width="2" height="4" fill="#3b2a1a"/><path d="M0 -24 L 7 -11 L 3.5 -11 L 9 -4 L -9 -4 L -3.5 -11 L -7 -11 Z" fill="#1f4a32"/></g><g transform="translate(40 182) scale(1.0)" stroke="#0f1a14" stroke-width="0.5"><rect x="-1" y="-4" width="2" height="4" fill="#3b2a1a"/><path d="M0 -24 L 7 -11 L 3.5 -11 L 9 -4 L -9 -4 L -3.5 -11 L -7 -11 Z" fill="#1f4a32"/></g><g transform="translate(54 184) scale(1.0)" stroke="#0f1a14" stroke-width="0.5"><rect x="-1" y="-4" width="2" height="4" fill="#3b2a1a"/><path d="M0 -24 L 7 -11 L 3.5 -11 L 9 -4 L -9 -4 L -3.5 -11 L -7 -11 Z" fill="#1f4a32"/></g>
    <path d="M70 200 C 80 192, 96 194, 104 188 C 112 182, 128 186, 140 180" fill="none" stroke="url(#water)" stroke-width="3"/>
    <path d="M74 198 l 6 -3 M96 192 l 6 -2" stroke="#c9eaff" stroke-width="0.5"/>
    <g stroke="#14161a" stroke-width="0.6">
      <rect x="150" y="166" width="40" height="34" fill="url(#barn)"/>
      <path d="M146 166 L 170 150 L 194 166 Z" fill="#3a2a22"/>
      <rect x="162" y="178" width="16" height="22" fill="#5a1410"/>
      <path d="M162 178 L 178 200 M178 178 L 162 200" stroke="#e8dcc0" stroke-width="1"/>
      <rect x="166" y="158" width="8" height="6" fill="#ffe08a"/>
    </g>
    <path d="M104 200 V 186 M118 200 V 186 M132 200 V 186 M146 200 V 186 M104 190 H 146 M104 196 H 146" stroke="#c9b28a" stroke-width="1.2"/>
    <text x="40" y="140" font-family="Arial, sans-serif" font-size="5" font-weight="bold" fill="#9aa6bc" opacity="0.6">elev. 4,200 ft</text>
    <rect x="0" y="200" width="220" height="10" fill="url(#grass)"/><path d="M0 200 H 220" stroke="#7fbf5a" stroke-width="0.8"/>
