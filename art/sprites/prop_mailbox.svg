    <text x="8.6" y="7.2" font-family="Arial, sans-serif" font-size="1.1" font-weight="bold" text-anchor="middle" fill="#e9e1c6" stroke="none">J. HOLLIS</text>
    <path d="M11.8 6.6 H 12.4 V 2 H 13.8 V 3.4 H 12.4" fill="#c8241c" stroke-width="0.25"/>
    <path d="M6.6 9.2 l -0.6 0.8 M7.4 9.2 l 0.6 0.8" stroke="#8a4019" stroke-width="0.2"/>
