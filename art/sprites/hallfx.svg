<svg xmlns="http://www.w3.org/2000/svg" viewBox="460 205 1000 600" width="2000" height="1200" data-canvas-width="1000" data-densities="2 3">
  <!--
    Animated bunker effects, drawn over the mountain at base-local (460, 205), 1000x600.
      part-lights  tunnel, shaft and storage lamp glows, brown out together
      part-leds    blinking LEDs on the electrical panels and the vending machine
      part-spark   a loose wire sparking by the fuse box (1324, 789.4)
  -->
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a7e8c"/><stop offset="0.25" stop-color="#5d616d"/><stop offset="1" stop-color="#3a3c44"/>
    </linearGradient>
    <radialGradient id="moonRim" cx="1255" cy="20" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c9d6f0" stop-opacity="0.35"/><stop offset="1" stop-color="#c9d6f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7fc"/><stop offset="1" stop-color="#b9c4d8"/>
    </linearGradient>
    <linearGradient id="wallH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e3239"/><stop offset="0.25" stop-color="#3b4049"/><stop offset="1" stop-color="#434852"/>
