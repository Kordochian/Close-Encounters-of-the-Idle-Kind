<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 32" width="384" height="256" data-canvas-width="36">
  <!--
    Specimen #2: cow, facing left, thousand-yard stare. Feet rest on y = 31.5, centered on x = 24.
    Parts (drawn back to front):
      part-tail   swishes about the rump (41, 12)
      part-body   torso and legs, static
      part-jaw    chews side to side (translated); a blade of grass hangs out
      part-head   bobs about the neck (14, 13)
      part-lids   blink (shown briefly)
      part-tag    the alien tracking tag's light, blinks
  -->
  <defs>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf9f2"/><stop offset="0.6" stop-color="#ece7da"/><stop offset="1" stop-color="#c9c2b2"/>
    </linearGradient>
    <linearGradient id="hideLeg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d9d3c4"/><stop offset="0.4" stop-color="#f4f1e8"/><stop offset="1" stop-color="#bdb6a6"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3a322c"/><stop offset="1" stop-color="#1c1714"/>
    </radialGradient>
    <radialGradient id="muzzle" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f8c6c1"/><stop offset="1" stop-color="#d98d88"/>
    </radialGradient>
    <linearGradient id="hoof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a221d"/><stop offset="0.4" stop-color="#5a4a3e"/><stop offset="1" stop-color="#211a16"/>
    </linearGradient>
    <filter id="hair" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4 3" numOctaves="2" seed="9"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0 0.35  1.3 0 0 0 -0.7"/>
    </filter>
    <clipPath id="torso"><rect x="12" y="8" width="31" height="16.5" rx="7"/></clipPath>
    <clipPath id="headClip"><path d="M3 5.5 C 3 3, 5 2.5, 8 2.5 L 12 2.5 C 14 2.5, 15 4, 15 6.5 L 15 12 C 15 15, 13 16, 11 16 L 5 16 C 3 16, 2 14, 2.5 12 Z"/></clipPath>
  </defs>

  <g id="part-tail" stroke="#1e1a1a" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M41 12 C 44 14, 45 18, 44.6 23" fill="none" stroke-width="1.6"/>
    <path d="M41 12 C 44 14, 45 18, 44.6 23" fill="none" stroke="#ece7da" stroke-width="0.75"/>
    <path d="M44.6 22.5 C 46.2 23.5, 46 26.2, 44.5 27 C 43 26.2, 43 23.5, 44.6 22.5 Z" fill="#2a2420"/>
    <path d="M44 23.6 l -0.3 2.6 M44.6 23.4 v 3 M45.2 23.6 l 0.3 2.6" stroke="#5a4a3e" stroke-width="0.2"/>
    <path d="M43.8 26.8 l -0.4 0.8 M44.5 27 v 0.9 M45.2 26.8 l 0.4 0.8" stroke-width="0.35"/>
  </g>

  <g id="part-body" stroke="#1e1a1a" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round">
    <!-- far legs -->
    <rect x="18.5" y="21" width="3.4" height="9.5" rx="1" fill="#c9c2b2"/>
    <rect x="37.5" y="21" width="3.4" height="9.5" rx="1" fill="#c9c2b2"/>
    <rect x="18.5" y="29" width="3.4" height="2.2" rx="0.6" fill="url(#hoof)"/>
    <rect x="37.5" y="29" width="3.4" height="2.2" rx="0.6" fill="url(#hoof)"/>
    <!-- torso -->
    <rect x="12" y="8" width="31" height="16.5" rx="7" fill="url(#hide)"/>
    <g clip-path="url(#torso)" stroke="none">
      <path d="M20 7 C 24 8, 26 12, 23 15 C 20 17, 16 14, 16.5 10.5 C 17 8.5, 18 7.2, 20 7 Z" fill="url(#spot)"/>
      <path d="M33 14 C 37 13, 41 15, 40 19 C 39 22, 34 23, 32 21 C 30 19, 30.5 15, 33 14 Z" fill="url(#spot)"/>
      <path d="M36 6 C 39 6, 42 8, 41 10.5 C 39.5 11.5, 36 10.5, 35.2 8.5 Z" fill="url(#spot)"/>
      <path d="M26.6 18.6 c 1 -0.6, 2.4 -0.4, 2.6 0.6 c -0.6 0.8, -2 0.8, -2.6 -0.6 Z" fill="url(#spot)"/>
      <!-- spot highlights -->
      <path d="M18.6 9 C 20.4 8.6, 22 9.6, 22.6 11" fill="none" stroke="#6a5c52" stroke-width="0.35"/>
      <path d="M33.6 15 C 35.6 14.4, 37.8 15, 38.6 16.4" fill="none" stroke="#6a5c52" stroke-width="0.35"/>
      <!-- belly shadow and spine ridge -->
      <path d="M12 20 C 20 23.5, 34 23.5, 43 20 L 43 26 L 12 26 Z" fill="#a9a193" opacity="0.55"/>
      <path d="M16 8.6 C 24 7.6, 32 7.6, 40 8.6" fill="none" stroke="#ffffff" stroke-width="0.6" opacity="0.8"/>
      <!-- ribs showing, a little -->
      <path d="M24 14.6 C 24.4 16, 24.4 17.6, 24 19 M26.4 14.4 C 26.8 15.8, 26.8 17.4, 26.4 18.8" fill="none" stroke="#b9b1a1" stroke-width="0.3"/>
      <rect x="12" y="8" width="31" height="17" filter="url(#hair)" opacity="0.35"/>
    </g>
    <rect x="12" y="8" width="31" height="16.5" rx="7" fill="none"/>
    <!-- udder -->
    <path d="M31 23.8 C 31 26.5, 36 26.5, 36 23.8 Z" fill="url(#muzzle)"/>
    <path d="M32 25.6 v 0.8 M33.4 26 v 0.8 M34.8 25.6 v 0.8" stroke-width="0.45"/>
    <!-- near legs: knee shading, hoof shine -->
    <rect x="14.5" y="21" width="3.6" height="9.8" rx="1" fill="url(#hideLeg)"/>
    <rect x="33.5" y="21" width="3.6" height="9.8" rx="1" fill="url(#hideLeg)"/>
    <path d="M15 26 h 2.6 M34 26 h 2.6" stroke="#a9a193" stroke-width="0.35"/>
    <rect x="14.5" y="29.2" width="3.6" height="2.3" rx="0.6" fill="url(#hoof)"/>
    <rect x="33.5" y="29.2" width="3.6" height="2.3" rx="0.6" fill="url(#hoof)"/>
    <path d="M16.3 29.4 v 2 M35.3 29.4 v 2" stroke-width="0.3"/>
    <path d="M15 29.8 h 0.8 M34 29.8 h 0.8" stroke="#8a7a6a" stroke-width="0.3"/>
  </g>

  <!-- Lower jaw, chewing, with a blade of grass -->
  <g id="part-jaw" stroke="#1e1a1a" stroke-width="0.7" stroke-linejoin="round">
    <path d="M1.4 17.6 C 0.6 18.6, 0.3 20.4, 0.5 22" fill="none" stroke="#3f7a2e" stroke-width="0.6"/>
    <path d="M1.4 17.6 C 0.6 18.6, 0.3 20.4, 0.5 22" fill="none" stroke="#79c25a" stroke-width="0.25"/>
    <path d="M2.6 16.5 C 3 19.8, 9.5 19.8, 10.6 16.5 Z" fill="#e7a3a0"/>
    <path d="M4.5 18 C 6 18.6, 8 18.6, 9 18" fill="none" stroke="#b56f6c" stroke-width="0.4"/>
    <path d="M3.2 17 C 5 17.8, 8.4 17.8, 10 17" fill="none" stroke="#f6c9c4" stroke-width="0.3"/>
  </g>

  <g id="part-head" stroke="#1e1a1a" stroke-width="0.7" stroke-linejoin="round" stroke-linecap="round">
    <!-- Horns with growth rings -->
    <path d="M9.5 3 C 9 0.8, 10.4 0.2, 11 0.6 C 10.6 1.2, 10.6 2, 11 3" fill="#efe3c2"/>
    <path d="M9.6 2 h 1.1 M9.7 1.3 h 0.9" stroke="#b8a77c" stroke-width="0.2"/>
    <!-- Ear with tracking tag (barcode and all) -->
    <path d="M13.5 5 C 16 3.8, 18.8 4.2, 19.2 5.6 C 17.6 6.8, 15.2 6.8, 13.6 6.6 Z" fill="url(#hide)"/>
    <path d="M14.6 5.4 C 16 4.8, 17.6 4.9, 18.4 5.5" fill="none" stroke="#e6a8a2" stroke-width="0.5"/>
    <rect x="16.4" y="6.3" width="2.4" height="2.8" rx="0.4" fill="#e9c93a" stroke-width="0.5"/>
    <path d="M16.8 6.8 v 0.9 M17.1 6.8 v 0.9 M17.5 6.8 v 0.9 M17.7 6.8 v 0.9 M18.1 6.8 v 0.9 M18.3 6.8 v 0.9" stroke="#3a3216" stroke-width="0.12"/>
    <circle cx="17.6" cy="8.4" r="0.45" fill="#2b4a2b" stroke="none"/>
    <!-- Head -->
    <path d="M3 5.5 C 3 3, 5 2.5, 8 2.5 L 12 2.5 C 14 2.5, 15 4, 15 6.5 L 15 12 C 15 15, 13 16, 11 16 L 5 16 C 3 16, 2 14, 2.5 12 Z" fill="url(#hide)"/>
    <g clip-path="url(#headClip)" stroke="none">
      <path d="M9 1 C 13 1, 16 4, 15.5 8 C 13 8.5, 10.5 6.5, 9.5 4.5 Z" fill="url(#spot)"/>
      <path d="M15 8 C 15 12, 13.6 15, 11 16 L 16 16 Z" fill="#a9a193" opacity="0.5"/>
      <!-- forehead cowlick -->
      <path d="M6 3.4 c 0.8 0.6, 1 1.4, 0.6 2.2 M7 3.2 c 0.6 0.6, 0.8 1.2, 0.5 1.8" fill="none" stroke="#c9c2b2" stroke-width="0.3"/>
    </g>
    <path d="M3 5.5 C 3 3, 5 2.5, 8 2.5 L 12 2.5 C 14 2.5, 15 4, 15 6.5 L 15 12 C 15 15, 13 16, 11 16 L 5 16 C 3 16, 2 14, 2.5 12 Z" fill="none"/>
    <!-- Muzzle -->
    <path d="M1.8 12.5 C 1.8 10.4, 4 10, 6.5 10 C 9.5 10, 11.2 10.6, 11.2 13 C 11.2 15.8, 9 17, 6.5 17 C 3.5 17, 1.8 15.5, 1.8 12.5 Z" fill="url(#muzzle)"/>
    <ellipse cx="4" cy="13" rx="0.75" ry="1.05" fill="#5a2f2c" stroke="none"/>
    <ellipse cx="8.4" cy="13" rx="0.75" ry="1.05" fill="#5a2f2c" stroke="none"/>
    <path d="M3.4 12.2 c 0.3 -0.4, 0.8 -0.4, 1.1 0 M7.8 12.2 c 0.3 -0.4, 0.8 -0.4, 1.1 0" fill="none" stroke="#f9d6d2" stroke-width="0.25"/>
    <path d="M3.4 10.8 C 5 10.4, 7.6 10.4, 9.6 10.9" fill="none" stroke="#fde3df" stroke-width="0.35"/>
    <g fill="#c27a76" stroke="none"><circle cx="5.6" cy="15.4" r="0.14"/><circle cx="6.6" cy="15.6" r="0.14"/><circle cx="7.6" cy="15.4" r="0.14"/></g>
    <!-- The stare: wide whites, pinprick pupils, looking straight at you -->
    <ellipse cx="6.4" cy="7.2" rx="1.9" ry="2" fill="#fffef6" stroke-width="0.55"/>
    <ellipse cx="11.2" cy="7.2" rx="1.6" ry="1.9" fill="#fffef6" stroke-width="0.55"/>
    <path d="M5 8.4 l 0.6 -0.3 M7.8 8.6 l -0.5 -0.4 M12.4 8.2 l -0.5 -0.2" stroke="#d98a85" stroke-width="0.15"/>
    <circle cx="6.6" cy="7.4" r="0.45" fill="#111" stroke="none"/>
    <circle cx="11.1" cy="7.4" r="0.4" fill="#111" stroke="none"/>
    <circle cx="6.45" cy="7.25" r="0.13" fill="#fff" stroke="none"/>
    <circle cx="10.95" cy="7.25" r="0.12" fill="#fff" stroke="none"/>
    <!-- Long lashes and heavy under-eye lines -->
    <path d="M4.6 6.2 l -0.6 -0.5 M5.2 5.5 l -0.3 -0.6 M10 5.7 l -0.2 -0.6 M10.6 5.4 l 0 -0.6" stroke-width="0.3"/>
    <path d="M4.8 9.6 C 5.8 10.1, 7 10.1, 8 9.6" fill="none" stroke="#a49c8e" stroke-width="0.4"/>
    <path d="M10 9.4 C 10.8 9.8, 11.8 9.8, 12.6 9.4" fill="none" stroke="#a49c8e" stroke-width="0.35"/>
  </g>

  <g id="part-lids" stroke="#1e1a1a" stroke-width="0.55">
    <ellipse cx="6.4" cy="7.2" rx="1.95" ry="2.05" fill="url(#hide)"/>
    <ellipse cx="11.2" cy="7.2" rx="1.65" ry="1.95" fill="url(#hide)"/>
    <path d="M4.6 7.4 C 5.6 8, 7.2 8, 8.2 7.4 M9.7 7.4 C 10.6 8, 11.8 8, 12.7 7.4" fill="none" stroke-width="0.5"/>
    <path d="M5 7.9 l -0.3 0.6 M6 8.1 l -0.1 0.6 M10.4 7.9 l -0.2 0.6" stroke-width="0.25"/>
  </g>

  <g id="part-tag" stroke="none">
    <circle cx="17.6" cy="8.4" r="1.9" fill="#6dff8a" opacity="0.3"/>
    <circle cx="17.6" cy="8.4" r="0.9" fill="#6dff8a" opacity="0.5"/>
    <circle cx="17.6" cy="8.4" r="0.45" fill="#e6ffea"/>
  </g>
</svg>
