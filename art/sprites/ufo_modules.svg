<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="384" height="192" data-canvas-width="96">
  <!--
    Experimental UFO Modules (Incompetence dept): odd boxes bolted onto every ship. Same 96x48 frame and
    anchor (48, 26) as the ships; drawn with the ship's tilt.
      part-module   a bolted-on box with a fan, a coffee-can exhaust and a BETA sticker
      part-fan_a    fan blades, frame A
      part-fan_b    fan blades, frame B
  -->
  <defs>
    <linearGradient id="boxM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7a5c"/><stop offset="1" stop-color="#5a4a30"/>
    </linearGradient>
  </defs>
  <g id="part-module" stroke="#1d1a20" stroke-width="0.5" stroke-linejoin="round">
    <rect x="62" y="12" width="13" height="8" rx="0.8" fill="url(#boxM)"/>
    <path d="M63 20 l -1 2 M74 20 l 1 2" stroke="#9aa1a8" stroke-width="0.8"/>
    <g fill="#c9c2a8" stroke="none"><circle cx="63.4" cy="13.2" r="0.35"/><circle cx="73.6" cy="13.2" r="0.35"/><circle cx="63.4" cy="18.8" r="0.35"/><circle cx="73.6" cy="18.8" r="0.35"/></g>
    <rect x="66" y="9" width="3" height="3.4" fill="#9aa1a8"/>
    <rect x="69.6" y="14" width="4.4" height="2" fill="#e2b923" stroke-width="0.25"/>
    <text x="71.8" y="15.6" font-family="Arial, sans-serif" font-size="1.4" font-weight="bold" text-anchor="middle" fill="#1d1a20" stroke="none">BETA</text>
    <circle cx="65.4" cy="16" r="2.2" fill="#2a2e34"/>
    <!-- coffee-can exhaust held on with tape -->
    <rect x="10" y="22" width="5" height="4" fill="#b8bec4"/>
    <path d="M10 23.4 h 5" stroke="#c9c6be" stroke-width="1.2"/>
  </g>
  <g id="part-fan_a" stroke="#1d1a20" stroke-width="0.3">
    <path d="M65.4 16 L 65.4 14.2 M65.4 16 L 67 16.8 M65.4 16 L 63.8 16.8" stroke="#d6dbe2" stroke-width="0.7"/>
  </g>
  <g id="part-fan_b" stroke="#1d1a20" stroke-width="0.3">
    <path d="M65.4 16 L 67 15.2 M65.4 16 L 65.4 17.8 M65.4 16 L 63.8 15.2" stroke="#d6dbe2" stroke-width="0.7"/>
  </g>
</svg>
