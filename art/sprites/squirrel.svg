<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" data-canvas-width="24">
  <!--
    Specimen #1: squirrel, facing left. Feet rest on y = 31, centered on x = 16.
    Parts (render_sprites.py renders each to a full-frame PNG; drawn back to front):
      part-tail    swishes about (20, 27)
      part-body    static
      part-head    twitches about the neck (12, 18)
      part-pupils  dart around inside the eyes; rotate with the head
      part-arms    acorn and paws; bob with the head
  -->
  <defs>
    <radialGradient id="fur" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#c9773d"/><stop offset="0.6" stop-color="#a9582a"/><stop offset="1" stop-color="#7c3c1a"/>
    </radialGradient>
    <radialGradient id="tailFur" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#cf7d40"/><stop offset="0.55" stop-color="#a9582a"/><stop offset="1" stop-color="#6e3315"/>
    </radialGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6dcb6"/><stop offset="1" stop-color="#d9b088"/>
    </linearGradient>
    <radialGradient id="eyeball" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.75" stop-color="#f6efd8"/><stop offset="1" stop-color="#e3c9b0"/>
    </radialGradient>
    <linearGradient id="acorn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6024"/><stop offset="0.4" stop-color="#d0a457"/><stop offset="1" stop-color="#7a521c"/>
    </linearGradient>
    <pattern id="capHatch" width="0.9" height="0.9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="0.9" height="0.9" fill="#6e4524"/><path d="M0 0 H 0.9 M0 0 V 0.9" stroke="#4a2c14" stroke-width="0.25"/>
    </pattern>
    <clipPath id="sqBody"><ellipse cx="16" cy="23.5" rx="7" ry="7"/></clipPath>
    <clipPath id="sqHead"><circle cx="10.5" cy="13" r="6"/></clipPath>
    <clipPath id="sqTail"><path d="M20 27 C 27 27, 30.5 21, 29 14 C 28 9, 30 5, 26.5 2.5 C 23 0.5, 18.5 2, 18 5 C 21 3.5, 24 4.5, 24.5 8 C 25 12, 21.5 15, 21 19 C 20.5 22, 19 24.5, 20 27 Z"/></clipPath>
  </defs>

  <g id="part-tail" stroke="#2a1810" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
    <path d="M20 27 C 27 27, 30.5 21, 29 14 C 28 9, 30 5, 26.5 2.5 C 23 0.5, 18.5 2, 18 5 C 21 3.5, 24 4.5, 24.5 8 C 25 12, 21.5 15, 21 19 C 20.5 22, 19 24.5, 20 27 Z" fill="url(#tailFur)"/>
    <g clip-path="url(#sqTail)" fill="none" stroke-linecap="round">
      <!-- Fur strands, dark under-layer then light tips -->
      <path d="M23 25 l 2 -2.4 M25.5 23.6 l 2 -2.8 M27 20.6 l 1.4 -3 M27.6 16.4 l 0.8 -3.2 M27.4 12 l 0.6 -3 M26.6 7.8 l 0.6 -2.8 M24.6 4.4 l 1.6 -1 M21.6 3.2 l 1.8 0" stroke="#6e3315" stroke-width="0.35"/>
      <path d="M22.4 22.6 l 1.6 -2.2 M23.4 18.6 l 1.4 -2.4 M24.6 14.6 l 0.8 -2.6 M25.2 10.6 l 0.4 -2.4 M25 6.4 l 0.8 -1.8" stroke="#e39c5e" stroke-width="0.3"/>
      <path d="M26.2 4.5 C 27.6 7, 26.8 10, 27 13 C 27.4 18, 25.5 22, 22.5 24.5" stroke="#d98a4a" stroke-width="1.1" opacity="0.8"/>
      <path d="M26.6 6 C 27.4 8, 27 11, 27.2 13.4" stroke="#f3b67a" stroke-width="0.35"/>
    </g>
    <!-- Scraggly tufts sticking out -->
    <path d="M29 14 l 1.8 -0.8 l -0.6 0.9 l 1.2 -0.2 M29.4 18 l 1.8 0.4 M28.8 21 l 1.4 0.9 M27 24 l 1.4 1.2 M26.5 2.5 l 1 -1.8 M24.8 1.4 l 0.4 -1" fill="none" stroke-width="0.6"/>
    <!-- Bald patch with a bandage -->
    <ellipse cx="28.4" cy="9.8" rx="1.3" ry="1.6" fill="#e6b49a"/>
    <path d="M27.7 9.2 l 0.3 0.4 M28.9 10.6 l 0.2 0.3" stroke="#c9917a" stroke-width="0.2"/>
    <path d="M26.2 11.6 L 30.8 8.4" fill="none" stroke-width="2.3"/>
    <path d="M26.2 11.6 L 30.8 8.4" fill="none" stroke="#f0e2c0" stroke-width="1.5"/>
    <path d="M27.8 10.5 L 29.2 9.5" fill="none" stroke="#d9c49c" stroke-width="1.5"/>
    <g fill="#c9b48c" stroke="none"><circle cx="27" cy="11.2" r="0.14"/><circle cx="30" cy="9.1" r="0.14"/><circle cx="27.4" cy="10.7" r="0.14"/><circle cx="29.6" cy="8.7" r="0.14"/></g>
  </g>

  <g id="part-body" stroke="#2a1810" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="20" cy="30" rx="3.8" ry="1.4" fill="#7e3f1c"/>
    <path d="M17.6 30.6 l 0 0.6 M19 30.9 l 0 0.5 M20.4 30.9 l 0 0.5" stroke="#2a1810" stroke-width="0.3"/>
    <ellipse cx="16" cy="23.5" rx="7" ry="7" fill="url(#fur)"/>
    <g clip-path="url(#sqBody)" stroke="none">
      <path d="M10.5 20 C 9.5 24, 11 29, 15 29.6 C 13.5 26, 13.5 22, 14.5 19 Z" fill="url(#belly)"/>
      <path d="M17 30.5 C 21 30, 23.4 27, 23.4 23 L 24 31 Z" fill="#5a2a10" opacity="0.45"/>
      <g fill="none" stroke-linecap="round">
        <path d="M17 18 l 1 0.8 M19.6 19 l 1 1 M21.4 21.4 l 0.8 1 M22 24.6 l 0.6 1 M20.6 27.4 l 0.4 1 M18 22 l 0.8 0.6 M19.6 24.6 l 0.6 0.8" stroke="#6e3315" stroke-width="0.3"/>
        <path d="M16.4 17.6 l 1 0.6 M18.4 20.4 l 0.9 0.8 M20.6 22.8 l 0.6 0.9" stroke="#dc8f52" stroke-width="0.25"/>
        <path d="M11.6 22 l 0.6 0.4 M11.8 24.6 l 0.6 0.3 M12.4 27 l 0.6 0.3" stroke="#c9a07a" stroke-width="0.25"/>
      </g>
    </g>
    <ellipse cx="16" cy="23.5" rx="7" ry="7" fill="none"/>
    <ellipse cx="11.5" cy="30.4" rx="3" ry="1.1" fill="#8e4720"/>
    <path d="M9.2 30.8 l -0.4 0.5 M10.4 31.1 l -0.3 0.5 M11.6 31.2 l -0.2 0.5" stroke="#2a1810" stroke-width="0.3"/>
  </g>

  <g id="part-head" stroke="#2a1810" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="10.5" cy="13" r="6" fill="url(#fur)"/>
    <g clip-path="url(#sqHead)" fill="none" stroke-linecap="round">
      <path d="M13 8.4 l 0.8 0.8 M14.8 10.6 l 0.8 0.6 M15.6 13.4 l 0.8 0.4 M15.2 16 l 0.6 0.6 M11 7.6 l 0.6 0.6" stroke="#6e3315" stroke-width="0.3"/>
      <path d="M12.4 8 l 0.6 0.8 M14 10 l 0.8 0.6" stroke="#e39c5e" stroke-width="0.25"/>
      <path d="M16.2 13 C 16.2 16, 14 18.4, 11 19" stroke="#5a2a10" stroke-width="1.6" opacity="0.4"/>
    </g>
    <circle cx="10.5" cy="13" r="6" fill="none"/>
    <!-- Ear with a bite taken out -->
    <path d="M11.5 8 L 13 2.8 L 14.2 4.4 L 13.4 5.2 L 14.6 5.8 L 15.2 8.8 Z" fill="#a9582a"/>
    <path d="M12.6 7.6 L 13.2 4.4 L 14.2 7.8 Z" fill="#e39b84" stroke="none"/>
    <path d="M13.4 5.2 l 0.4 0.3 M14.6 5.8 l -0.3 0.4" stroke="#7a2f20" stroke-width="0.3"/>
    <path d="M12.9 3.2 l -0.3 -0.8 M13.2 3 l 0.1 -0.9" stroke-width="0.35"/>
    <!-- Muzzle with shading, nose with a shine, chipped buck teeth -->
    <ellipse cx="6.2" cy="15.6" rx="3" ry="2.4" fill="url(#belly)"/>
    <path d="M3.6 16.6 C 4.4 17.8, 7 18.2, 8.8 17" fill="none" stroke="#b9875f" stroke-width="0.35"/>
    <g fill="#8a5a3a" stroke="none"><circle cx="5.4" cy="15.8" r="0.15"/><circle cx="6.2" cy="16.2" r="0.15"/><circle cx="7" cy="15.8" r="0.15"/></g>
    <circle cx="3.6" cy="14.6" r="1.1" fill="#2a1810"/>
    <ellipse cx="3.3" cy="14.2" rx="0.35" ry="0.25" fill="#9b7a6a" stroke="none"/>
    <path d="M5.2 17.6 h 1.4 v 2 h -1.4 Z" fill="#fffbe8" stroke-width="0.5"/>
    <path d="M6.6 17.6 h 1.4 v 1.3 l -0.6 0.4 h -0.8 Z" fill="#fffbe8" stroke-width="0.5"/>
    <path d="M5.5 18 v 1.2" stroke="#e8dfc0" stroke-width="0.25"/>

    <!-- Far eye, peeking -->
    <ellipse cx="5.6" cy="11.3" rx="1.6" ry="2" fill="url(#eyeball)" stroke-width="0.6"/>
    <!-- Near eye: huge, bloodshot, has seen the tractor beam -->
    <circle cx="9.6" cy="11.4" r="3.3" fill="url(#eyeball)"/>
    <path d="M12.6 10.5 l -1 0.3 l -0.3 0.5 M12.4 12.9 l -0.9 -0.3 l -0.5 0.1 M10 14.5 l 0.1 -0.8 l 0.3 -0.3 M7 13.6 l 0.7 -0.5 M6.6 10.4 l 0.7 0.2" fill="none" stroke="#d2342a" stroke-width="0.22"/>
    <path d="M6.6 12.6 C 7 14.2, 9.6 15, 11.6 13.8" fill="none" stroke="#d6b29c" stroke-width="0.4" opacity="0.7"/>
    <!-- Bags under the eye, twitchy brow -->
    <path d="M7.2 15.2 C 8.4 16.1, 10.6 16.1, 11.8 15" fill="none" stroke="#6e3417" stroke-width="0.6"/>
    <path d="M7.6 15.9 C 8.8 16.6, 10.4 16.6, 11.4 15.9" fill="none" stroke="#6e3417" stroke-width="0.3"/>
    <path d="M6.8 7.6 L 9.4 8.4 L 12.4 7.2" fill="none" stroke-width="0.9"/>
    <path d="M7.6 7.4 l 0.3 -0.5 M9 7.8 l 0.2 -0.6 M10.6 7.6 l 0.2 -0.6 M11.8 7.2 l 0.3 -0.5" stroke-width="0.35"/>

    <!-- Whiskers with follicle dots -->
    <path d="M4 16 l -3.4 -0.6 M4.2 16.6 l -3.2 1 M4.4 17.2 l -2.6 2.2 M3.8 15.4 l -3 -1.6" fill="none" stroke-width="0.3"/>
  </g>

  <g id="part-pupils" stroke="none">
    <circle cx="5" cy="11.6" r="0.55" fill="#111"/>
    <circle cx="8.5" cy="11.2" r="0.9" fill="#111"/>
    <circle cx="8.5" cy="11.2" r="0.55" fill="#3a2a1c"/>
    <circle cx="8.5" cy="11.2" r="0.32" fill="#050505"/>
    <circle cx="8.2" cy="10.9" r="0.25" fill="#fff"/>
    <circle cx="8.9" cy="11.6" r="0.1" fill="#fff"/>
    <circle cx="4.8" cy="11.4" r="0.14" fill="#fff"/>
  </g>

  <!-- Paws clutching an acorn, white-knuckled -->
  <g id="part-arms" stroke="#2a1810" stroke-width="0.8" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="7.5" cy="22.5" rx="2.6" ry="3" fill="url(#acorn)"/>
    <path d="M6.2 21.6 C 6 23, 6.4 24.4, 7 25" fill="none" stroke="#f0d08e" stroke-width="0.35"/>
    <path d="M7.5 25.4 l 0 0.5" stroke-width="0.5"/>
    <path d="M4.7 21.2 C 5 18.8, 10 18.8, 10.3 21.2 Z" fill="url(#capHatch)"/>
    <path d="M4.9 21 C 6.5 20.2, 8.6 20.2, 10.1 21" fill="none" stroke="#8a6a44" stroke-width="0.3"/>
    <path d="M7.5 18.9 l 0.3 -1.3" fill="none"/>
    <path d="M5 23 c 0.8 0.3, 1.5 -0.4, 1.4 -1.2 c -0.6 -0.6, -1.8 -0.3, -2 0.4 Z" fill="#c26a35"/>
    <path d="M10.2 23.2 c -0.8 0.3, -1.5 -0.4, -1.4 -1.2 c 0.6 -0.6, 1.8 -0.3, 2 0.4 Z" fill="#c26a35"/>
    <!-- Little claws digging in -->
    <path d="M5.8 22 l 0.5 0.1 M5.9 22.6 l 0.5 0 M9.3 22.1 l -0.5 0.1 M9.3 22.7 l -0.5 0" stroke="#f4ead6" stroke-width="0.25"/>
  </g>
</svg>
